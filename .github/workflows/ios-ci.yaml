name: iOS CI
on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]
permissions:
  contents: read
concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    name: Release Policy
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, ubuntu-latest, docker]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # No Environment or protected App credential is available to PR policy checks.
      - name: Ruby policy
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e GEM_HOME=/tmp/gems \
            -v "${GITHUB_WORKSPACE}:/work:ro" -w /work \
            ruby:3.4.10@sha256:ce3b7a999d9e430e59e1a12456c631fbea3dd18948c89cf8a913c3566c77b2ae \
            bash -euc 'ruby -c fastlane/Fastfile; ruby fastlane/test/run_all.rb'
      - name: Validate workflow syntax
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "${GITHUB_WORKSPACE}:/work:ro" -w /work \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color -shellcheck=
