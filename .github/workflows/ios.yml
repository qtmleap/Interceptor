name: iOS Simulator

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep simulator verification and the signing build on the same package commit.
  MUDMOUTH_REV: 3c1468aaaea5140835982bc8e38c9d3bfc49d2a0

concurrency:
  # Every develop push must reach the deployment queue. PR runs still supersede
  # older tests, but separate develop pushes must not cancel one another.
  group: ios-${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  release_checks:
    name: Validate TestFlight automation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Validate release configuration and cleanup
        run: |
          ruby -c fastlane/Fastfile
          ruby fastlane/test/testflight_config_test.rb
          python3 -m unittest discover -s scripts/tests -v
          bash -n scripts/ci-testflight.sh

  simulator:
    name: Build and test (Xcode 27)
    runs-on: xcode-27
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Interceptor
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: Interceptor
          persist-credentials: false

      - name: Check out local Mudmouth dependency
        uses: actions/checkout@v4
        with:
          repository: qtmleap/Mudmouth
          ref: ${{ env.MUDMOUTH_REV }}
          path: Mudmouth
          persist-credentials: false

      - name: Authenticate private QuantumLeap dependency
        env:
          QUANTUMLEAP_READ_TOKEN: ${{ secrets.QUANTUMLEAP_READ_TOKEN }}
        run: |
          if [ -z "$QUANTUMLEAP_READ_TOKEN" ]; then
            echo "::error::QUANTUMLEAP_READ_TOKEN is required to read the private QuantumLeap package"
            exit 1
          fi
          umask 077
          printf 'machine github.com\n  login x-access-token\n  password %s\n' "$QUANTUMLEAP_READ_TOKEN" > "$HOME/.netrc"

      - name: Select dedicated iPhone simulator
        run: |
          xcodebuild -version
          echo "PLL_SOURCE_PACKAGES_PATH=$RUNNER_TEMP/SourcePackages" >> "$GITHUB_ENV"
          xcrun simctl list runtimes --json > "$RUNNER_TEMP/runtimes.json"
          runtime=$(python3 - "$RUNNER_TEMP/runtimes.json" <<'PY'
          import json, sys
          runtimes = json.load(open(sys.argv[1]))["runtimes"]
          available = [r for r in runtimes if r.get("isAvailable") and ".iOS-" in r["identifier"] and tuple(map(int, r["version"].split("."))) >= (18, 5)]
          if not available:
              raise SystemExit("No available iOS 18.5+ simulator runtime")
          print(max(available, key=lambda r: tuple(map(int, r["version"].split("."))))["identifier"])
          PY
          )
          device=$(xcrun simctl create "Interceptor CI" com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro "$runtime")
          echo "SIMULATOR_UUID=$device" >> "$GITHUB_ENV"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl list devices booted

      - name: Build and run unit and UI tests
        run: |
          set -o pipefail
          NSUnbufferedIO=YES xcodebuild test \
            -project Interceptor.xcodeproj -scheme Interceptor \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UUID" \
            -destination-timeout 60 \
            -clonedSourcePackagesDirPath "$PLL_SOURCE_PACKAGES_PATH" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -packageAuthorizationProvider netrc -onlyUsePackageVersionsFromResolvedFile \
            -skipPackagePluginValidation \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics never \
            -resultBundlePath "$RUNNER_TEMP/Interceptor.xcresult" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- > >(tee "$RUNNER_TEMP/test.log") 2>&1 &
          build_pid=$!
          (
            while kill -0 "$build_pid" 2>/dev/null; do
              sleep 120 > /dev/null 2>&1
              if kill -0 "$build_pid" 2>/dev/null; then
                date -u
                ps -p "$build_pid" -o pid,etime,pcpu,stat,comm
                sample_path="$RUNNER_TEMP/xcodebuild-sample-$(date +%s).txt"
                sample "$build_pid" 3 -file "$sample_path" || true
                if [ -f "$sample_path" ]; then sed -n '1,100p' "$sample_path"; fi
              fi
            done
          ) > >(tee "$RUNNER_TEMP/diagnostics.log") 2>&1 &
          diagnostics_pid=$!
          trap 'kill "$diagnostics_pid" 2>/dev/null || true' EXIT
          wait "$build_pid"

      - name: Save test results and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-results
          path: |
            ${{ runner.temp }}/Interceptor.xcresult
            ${{ runner.temp }}/test.log
            ${{ runner.temp }}/diagnostics.log
            ${{ runner.temp }}/xcodebuild-sample-*.txt
          if-no-files-found: ignore
          retention-days: 7

  testflight:
    name: Deploy to TestFlight
    needs: [simulator, release_checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: xcode-27
    timeout-minutes: 90
    environment: testflight
    concurrency:
      group: interceptor-testflight
      cancel-in-progress: false
      queue: max
    defaults:
      run:
        working-directory: Interceptor
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: Interceptor
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: qtmleap/Mudmouth
          ref: ${{ env.MUDMOUTH_REV }}
          path: Mudmouth
          persist-credentials: false
      - name: Select Ruby on the self-hosted Mac
        run: |
          if ! brew list --versions ruby@3.3 >/dev/null 2>&1; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install ruby@3.3
          fi
          echo "$(brew --prefix ruby@3.3)/bin" >> "$GITHUB_PATH"
          echo "GEM_HOME=$RUNNER_TEMP/testflight-gems" >> "$GITHUB_ENV"
          echo "GEM_PATH=$RUNNER_TEMP/testflight-gems" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/testflight-gems/bin" >> "$GITHUB_PATH"
          echo "BUNDLE_PATH=$RUNNER_TEMP/testflight-bundle" >> "$GITHUB_ENV"
          echo "BUNDLE_FROZEN=true" >> "$GITHUB_ENV"
      - name: Install locked fastlane dependencies
        run: |
          ruby --version
          gem install bundler -v 2.6.9 --no-document
          bundle _2.6.9_ install
      - name: Archive and upload the tested commit
        env:
          QUANTUMLEAP_READ_TOKEN: ${{ secrets.QUANTUMLEAP_READ_TOKEN }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: bash scripts/ci-testflight.sh
      - name: Remove per-job Ruby dependencies
        if: always()
        run: rm -rf "$RUNNER_TEMP/testflight-gems" "$RUNNER_TEMP/testflight-bundle"
