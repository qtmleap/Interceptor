name: iOS Simulator

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep simulator verification and the signing build on the same package commit.
  MUDMOUTH_REV: dddd2cb92fc67e414517dd316de33f6f2c6a9f4c

concurrency:
  # Every develop push must reach the deployment queue. PR runs still supersede
  # older tests, but separate develop pushes must not cancel one another.
  group: ios-${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  ci-change-scope:
    permissions:
      contents: read
    uses: ./.github/workflows/ci-change-scope.yaml
    with:
      doc-paths: '[".agents/skills/ios-development/SKILL.md",".agents/skills/ios-development/references/app-review-followup.md",".agents/skills/ios-development/references/release-policy.md",".agents/skills/ios-development/references/testing-policy.md","AGENTS.md","CLAUDE.md","LICENSE","README.md","docs/app-review/README.md","docs/app-review/apple-policy-disclaimer.md","docs/app-review/privacy-policy-draft.md","docs/app-review/review-notes-1.1.0-beta.md","docs/app-review/review-notes-draft.md","docs/automation/foundation-ledger.md","docs/automation/publishing-repository.md","docs/automation/release-gates.md","docs/automation/repository-runtime-foundation.md","docs/development/ci-change-scope.md","docs/development/ios-development-routine.md","docs/superpowers/plans/2026-10-04-consent-settings-ui.md","docs/superpowers/plans/2026-10-04-review-fixes.md"]'
      doc-prefixes: '[]'
      runner: '["self-hosted","ubuntu-latest"]'

  release_checks:
    name: Validate TestFlight automation
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, ubuntu-latest, docker]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate release configuration and cleanup
        uses: qtmleap/actions/actions/ruby-check@00c36aeda988735333907b407d98f6a4a9478b64
        with:
          command: 'ruby -c fastlane/Fastfile; ruby fastlane/test/run_all.rb; bash -n scripts/ci-release.sh scripts/ci-release-cleanup.sh scripts/verify-toolchain.sh'

  simulator:
    needs: ["ci-change-scope"]
    name: Build and test (Xcode 27)
    if: ${{ !cancelled() && (true) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ${{ fromJSON((needs['ci-change-scope'].result == 'success' && needs['ci-change-scope'].outputs.docs_only == 'true') && '["self-hosted","ubuntu-latest"]' || '["self-hosted","macos-27"]') }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: Interceptor
        shell: bash
    steps:
      - uses: actions/checkout@v4
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        with:
          path: Interceptor
          persist-credentials: false

      - name: Check out local Mudmouth dependency
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        uses: actions/checkout@v4
        with:
          repository: qtmleap/Mudmouth
          ref: ${{ env.MUDMOUTH_REV }}
          path: Mudmouth
          persist-credentials: false

      - name: Verify the Xcode toolchain
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        uses: qtmleap/actions/actions/apple-toolchain@00c36aeda988735333907b407d98f6a4a9478b64
        with:
          repo-root: Interceptor
          xcode-version: '27'
          developer-dir: /Applications/Xcode_27.app/Contents/Developer

      - name: Verify plugin foundation
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        run: |
          python3 scripts/verify-quickjs-vendor.py
          swift test --package-path Packages/InterceptorAutomation

      - name: Select dedicated iPhone simulator
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        run: |
          xcodebuild -version
          echo "PLL_SOURCE_PACKAGES_PATH=$RUNNER_TEMP/SourcePackages" >> "$GITHUB_ENV"
          simulator_set="$HOME/Library/Developer/CoreSimulator/Devices"
          export CI_SIMULATOR_DEVICE_SET="$simulator_set"
          python3 -c 'import pathlib; [compile(p.read_text(), str(p), "exec") for p in map(pathlib.Path, ["scripts/ci-simulator-cleanup.py", "scripts/ci-simulator-start-worker.py"])]'
          echo "CI_SIMULATOR_DEVICE_SET=$simulator_set" >> "$GITHUB_ENV"
          hostname > "$RUNNER_TEMP/simulator-host.txt"
          printf '%s\n' "$simulator_set" >> "$RUNNER_TEMP/simulator-host.txt"
          xcrun simctl --set "$simulator_set" list devices --json > "$RUNNER_TEMP/simulators-before.json"
          pgrep -fl '/Simulator.app/Contents/MacOS/Simulator' > "$RUNNER_TEMP/simulator-processes-before.txt" || true
          xcrun simctl list runtimes --json > "$RUNNER_TEMP/runtimes.json"
          runtime=$(python3 - "$RUNNER_TEMP/runtimes.json" <<'PY'
          import json, sys
          runtimes = json.load(open(sys.argv[1]))["runtimes"]
          available = [r for r in runtimes if r.get("isAvailable") and ".iOS-" in r["identifier"] and tuple(map(int, r["version"].split("."))) >= (18, 5)]
          if not available:
              raise SystemExit("No available iOS 18.5+ simulator runtime")
          print(max(available, key=lambda r: tuple(map(int, r["version"].split("."))))["identifier"])
          PY
          )
          device=""
          cleanup_failed_setup() {
            if [ -n "$device" ]; then
              SIMULATOR_UUID="$device" python3 scripts/ci-simulator-cleanup.py || true
            fi
          }
          trap cleanup_failed_setup ERR
          trap 'cleanup_failed_setup; exit 130' INT
          trap 'cleanup_failed_setup; exit 143' TERM
          device=$(xcrun simctl --set "$simulator_set" create "Interceptor CI" com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro "$runtime")
          echo "SIMULATOR_UUID=$device" >> "$GITHUB_ENV"
          xcrun simctl --set "$simulator_set" boot "$device"
          xcrun simctl --set "$simulator_set" bootstatus "$device" -b
          xcrun simctl --set "$simulator_set" list devices booted

      - name: Resolve private package dependencies
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        env:
          QUANTUMLEAP_READ_TOKEN: ${{ secrets.QUANTUMLEAP_READ_TOKEN }}
        run: ruby scripts/ci-simulator-resolve.rb

      - name: Restore dependency authentication
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') && (always()) }}
        env:
          RELEASE_WORK: ${{ runner.temp }}/simulator-resolution
        uses: qtmleap/actions/actions/run-adapter@00c36aeda988735333907b407d98f6a4a9478b64
        with:
          repo-root: Interceptor
          adapter: fastlane/adapter.rb
          operation: cleanup

      - name: Build and run unit and UI tests
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') }}
        run: |
          set -o pipefail
          NSUnbufferedIO=YES python3 scripts/ci-simulator-start-worker.py xcodebuild test \
            -project Interceptor.xcodeproj -scheme Interceptor \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UUID" \
            -destination-timeout 60 \
            -clonedSourcePackagesDirPath "$PLL_SOURCE_PACKAGES_PATH" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -onlyUsePackageVersionsFromResolvedFile -disableAutomaticPackageResolution \
            -skipPackageUpdates \
            -skipPackagePluginValidation \
            -parallel-testing-enabled NO \
            -collect-test-diagnostics never \
            -resultBundlePath "$RUNNER_TEMP/Interceptor.xcresult" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- > >(tee "$RUNNER_TEMP/test.log") 2>&1 &
          build_pid=$!
          (
            while kill -0 "$build_pid" 2>/dev/null; do
              sleep 120 > /dev/null 2>&1
              if kill -0 "$build_pid" 2>/dev/null; then
                date -u
                ps -p "$build_pid" -o pid,etime,pcpu,stat,comm
                sample_path="$RUNNER_TEMP/xcodebuild-sample-$(date +%s).txt"
                sample "$build_pid" 3 -file "$sample_path" || true
                if [ -f "$sample_path" ]; then sed -n '1,100p' "$sample_path"; fi
              fi
            done
          ) > >(tee "$RUNNER_TEMP/diagnostics.log") 2>&1 &
          diagnostics_pid=$!
          stop_workers() {
            python3 scripts/ci-simulator-cleanup.py --stop-worker || true
            for worker_pid in "$diagnostics_pid" "$build_pid"; do
              if jobs -pr | grep -Fxq "$worker_pid"; then
                kill "$worker_pid" 2>/dev/null || true
                for attempt in {1..10}; do
                  if ! jobs -pr | grep -Fxq "$worker_pid"; then break; fi
                  sleep 1
                done
                if jobs -pr | grep -Fxq "$worker_pid"; then kill -KILL "$worker_pid" 2>/dev/null || true; fi
              fi
              wait "$worker_pid" 2>/dev/null || true
            done
          }
          trap stop_workers EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          wait "$build_pid"

      - name: Clean up dedicated iPhone simulator
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') && (always()) }}
        run: |
          python3 scripts/ci-simulator-cleanup.py

      - name: Save test results and build logs
        if: ${{ (needs['ci-change-scope'].result != 'success' || needs['ci-change-scope'].outputs.docs_only != 'true') && (always()) }}
        uses: actions/upload-artifact@v4
        with:
          name: simulator-results
          path: |
            ${{ runner.temp }}/Interceptor.xcresult
            ${{ runner.temp }}/test.log
            ${{ runner.temp }}/diagnostics.log
            ${{ runner.temp }}/xcodebuild-sample-*.txt
            ${{ runner.temp }}/simulator-build-group.json
            ${{ runner.temp }}/simulator-host.txt
            ${{ runner.temp }}/simulators-before.json
            ${{ runner.temp }}/simulator-processes-before.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Docs-only exemption
        if: ${{ needs['ci-change-scope'].result == 'success' && needs['ci-change-scope'].outputs.docs_only == 'true' }}
        shell: bash
        working-directory: .
        env:
          CI_CHANGE_REASON: ${{ needs['ci-change-scope'].outputs.reason }}
        run: |
          printf '%s\n' "$CI_CHANGE_REASON" >> "$GITHUB_STEP_SUMMARY"
