name: Traffic Fixture Deployment

# Manual only. Deploys the public, stateless test fixture to the `test` Wrangler environment.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: traffic-fixture-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to test
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/traffic-fixture
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run test
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test:runtime
      - run: bun run bundle
      - name: Wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./node_modules/.bin/wrangler deploy --env test
